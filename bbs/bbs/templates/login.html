<!DOCTYPE html>
<html>

<head>
    <title>BBS Login</title>
</head>

<body>
    <h1>Login</h1>
    
    {% if try_again %}
        <h2 style="color: red;">Username or password is incorrect</h2>
    {% endif %}

    <form>
        <label for="user">Username: </label><br>
        <input type="text" id="user" name="user">
        <br>
        <label for="paswd">Password: </label><br>
        <input type="password" id="paswd" name="paswd">
        <br>
        <input type="submit">
    </form>

</body>

</html>
