<!DOCTYPE html>
<html>

<head>
    <title>BBS Posts</title>

    <style>
        #header > p {
            margin-left: 10px;
            vertical-align: text-bottom;
            margin-top: auto;
            margin-bottom: 0;
        }
        #header > a {
            margin-left: 10px;
            vertical-align: text-bottom;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <div id="header" style="display: flex; flex-direction: row;">
        <h1 style="margin-bottom: 0; margin-right: auto;">Message Board</h1>
            {% if user is not none %}
                <p>(logged in as {{ user }})</p>
                <a href="/logout">Log Out</a>
            {% else %}
                <a href="/login">Log In</a>
                <a href="/enroll">Sign Up</a>
            {% endif %}
        <a href="/post">New Post</a>
    </div>
    
    <hr/>
    {% for post in posts %}
        <h2>{{ post["user"]}}</h2>
        <p>{{ post["body"]}}</p>
        
        <hr/>
    {% endfor %}
</body>

</html>
